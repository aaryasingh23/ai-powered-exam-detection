# Render Blueprint — one web service serves the React app and the API on HTTPS.
services:
  - type: web
    name: proctorguard-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DEMO_SIMULATOR
        value: "true"
      - key: SESSION_TTL_MINUTES
        value: "180"
